<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uncanny — Look twice.</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header><div class="wordmark">uncanny<span>®</span></div><span class="tagline">LOOK TWICE.</span></header>
    <div class="context"><span class="context-dot"></span><span id="platform-name">Checking page…</span><span class="preview-label">FRAME CAPTURE</span></div>
    <section id="scanner" class="scanner" aria-label="Human-to-robot character scanning animation">
      <span class="corner top-left"></span><span class="corner top-right"></span>
      <span class="corner bottom-left"></span><span class="corner bottom-right"></span>
      <div class="character">
        <img src="assets/human.png" alt="Illustrated woman wearing orange, denim jorts and high-top sneakers" width="1024" height="1536">
        <img class="robot-layer" src="assets/robot.png" alt="" aria-hidden="true" width="1024" height="1536">
        <div class="scan-beam" aria-hidden="true"></div>
      </div>
      <span class="scan-label" aria-hidden="true">UNCANNY</span>
    </section>
    <div class="heading-row"><h1 id="headline">A second look.</h1><span id="activity" class="activity" aria-hidden="true"><i></i><i></i><i></i></span></div>
    <p id="status" role="status">Play a video to capture six frames.</p>
    <button id="analyze-button" type="button" disabled>Capture frames</button>
    <section id="capture-results" hidden aria-label="Captured video frames">
      <h2>What Uncanny sees</h2>
      <div id="frames"></div>
      <p id="capture-note"></p>
      <button id="score-frames" type="button">Score frames on this Mac</button>
      <p id="score-result" role="status"></p>
      <button id="clear-frames" type="button">Clear frames</button>
    </section>
    <p class="disclaimer">Scoring processes six still images on this Mac. The signal describes the sample, not the whole video.</p>
  </main>
  <script src="capture.js"></script>
  <script src="score.js"></script>
  <script src="popup.js"></script>
</body>
</html>
